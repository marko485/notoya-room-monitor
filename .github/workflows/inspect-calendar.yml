name: Notoya room DOM diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - name: Inspect room calendar HTML (read only)
        run: python inspect_calendar.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notoya-dom-diagnostic
          path: artifacts/dom-diagnostic.*
          retention-days: 7
