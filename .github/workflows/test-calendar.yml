name: Notoya official calendar test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - name: Open official booking calendar (read-only)
        run: python probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notoya-calendar-test
          path: artifacts/
          retention-days: 7
