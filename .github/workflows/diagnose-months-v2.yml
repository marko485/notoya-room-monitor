name: Notoya month-switch diagnostic v2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - run: python diagnose_months_v2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notoya-month-switch-v2
          path: artifacts/
          retention-days: 7
